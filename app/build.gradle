plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.reverie'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.reverie"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.0'  // Untuk AppCompatActivity
    implementation 'com.google.android.material:material:1.8.0'  // Untuk BottomNavigationView
    implementation 'androidx.fragment:fragment:1.5.5'  // Untuk Fragment
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'  // Untuk ConstraintLayout, jika digunakan
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation libs.activity// Jika menggunakan RecyclerView

    // Untuk testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}